[package]
name = "shclap"
version = "0.3.7"
edition = "2021"
description = "Clap-style argument parsing for shell scripts"
authors = ["yanctab"]
license = "Apache-2.0"
repository = "https://github.com/yanctab/shclap"
homepage = "https://github.com/yanctab/shclap"
readme = "README.md"
keywords = ["cli", "shell", "argument-parsing", "bash"]
categories = ["command-line-utilities"]
exclude = [".github/", "debian/", "tests/", "BACKLOG.md", "CLAUDE.md"]

[dependencies]
clap = { version = "=4.4.18", features = ["derive", "string", "env"] }
serde = { version = "=1.0.196", features = ["derive"] }
serde_json = "=1.0.113"
tempfile = "=3.10.0"
anyhow = "=1.0.100"
thiserror = "=1.0.56"
log = "=0.4.21"
env_logger = "=0.11.6"
uzers = "=0.12.0"
glob = "=0.3.1"
tar = "=0.4.45"
flate2 = "=1.1.5"
bzip2 = "=0.6.1"
liblzma = "=0.4.8"
# Default features off: shclap only ever writes CompressionMethod::Stored, so
# zip's deflate/bzip2/zstd backends are unused, and its default `time`
# dependency pulled in a version with a DoS advisory (RUSTSEC-2026-0009) that
# zip 0.6 pins too tightly to update. Re-enable if a compressed zip is ever
# wanted.
zip = { version = "=0.6.6", default-features = false }
indexmap = { version = "=2.0.0", features = ["serde"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-x86_64-linux-musl"
pkg-fmt = "bin"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.deb]
maintainer = "yanctab <yanctab@users.noreply.github.com>"
copyright = "2026, yanctab"
license-file = ["LICENSE", "0"]
extended-description = """\
shclap brings the power of clap-style argument parsing to shell scripts. \
Define your CLI interface via JSON configuration, and shclap validates \
arguments and outputs a sourceable file with environment variables."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/shclap", "usr/bin/", "755"],
    ["man/shclap.1", "usr/share/man/man1/", "644"],
]
